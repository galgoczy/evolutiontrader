[project]
name = "evolab"
version = "0.0.1"
description = "Evolúciós paper-trading labor: stratégia-populáció, statisztikai bíró, LLM-kutató."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "ccxt>=4.4",
    "hyperliquid-python-sdk>=0.9",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
regime = ["hmmlearn>=0.3"]

[project.scripts]
evolab = "evolab.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
