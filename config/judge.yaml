# VÉDETT FÁJL. Csak dátumozott, emberi jóváhagyású módosítással változhat
# (version emelés + changelog bejegyzés). LLM-réteg (kutató, fejlesztő) nem írhatja.
version: 1
changelog:
  - {version: 1, date: "2026-10-10", change: "Induló küszöbök a docs/02-specifikacio.md 5.6 szerint."}

L1_backtest:
  min_trades: 100
  pf_min_at_2x_cost: 1.3
  max_dd_pct: 25
  oos_is_ratio_min: 0.5
  dsr_min: 0.95
  pbo_max: 0.20
  regimes_positive_min: 2
  param_stability: {perturb_pct: 20, must_stay_positive: true}
L1_holdout:                 # egyszer futtatható variánsonként
  pf_min: 1.1
  burn_rule: {same_family_param_delta_pct: 20, cooldown_days: 30}
L2_paper:
  min_trades: 200
  min_regimes: 2
  pf_min: 1.2
  dd_vs_backtest_max_ratio: 1.5
  demote_if: {pf_below: 1.1, dd_ratio_above: 1.5}
L3_micro:
  min_trades: 100
  pf_min: 1.0
  slippage_vs_model_max_ratio: 1.5
  demote_if: {pf_below: 1.0, dd_ratio_above: 1.5}
population: {size: 50, max: 100, cull_bottom_pct: 20, diversity_corr_max: 0.8}
holdout: {months: 6, rolling: true}

walkforward: {is_months: 12, oos_months: 3, step_months: 3}
cpcv: {n_blocks: 8, k_test: 2, purge_days: 7, embargo_days: 3}
dsr: {trial_window_days: 90, effective_trials: eigen}
diversity: {corr_max: 0.8, dsr_penalty: 0.9}
